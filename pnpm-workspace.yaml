packages:
  - 'apps/*'
  - 'packages/*'
  # Animate UI v1 is its own project in v1/, with its own lockfile: its old
  # copies here stay out of this workspace.
  - '!apps/v1'
  - '!packages/ui'

# Single source of truth for versions shared across the monorepo.
# Reference them with "catalog:" in package.json.
catalog:
  'react': ^19.3.0
  'react-dom': ^19.3.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@types/node': ^24.19.1
  'motion': ^14.0.0
  'radix-ui': ^1.6.7
  'lucide-react': ^1.50.0
  'class-variance-authority': ^0.7.1
  'clsx': ^2.1.1
  'tailwind-merge': ^3.7.0
  'tw-animate-css': ^1.4.0
  'tailwindcss': ^4.3.3
  '@tailwindcss/postcss': ^4.3.3
  'postcss': ^8.5.28
  'typescript': ^5.9.3
  'eslint': ^10.11.0
  'prettier': ^3.9.9
